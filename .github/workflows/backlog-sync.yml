name: Sync PR Lifecycle to Backlog Issue
on:
  pull_request:
    types: [opened, closed]
    branches: [main]

# リポジトリへの書き込みは不要なので全権限を無効化
permissions: {}

env:
  BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
  BACKLOG_SPACE: ${{ secrets.BACKLOG_SPACE }}
  # 「処理中」ステータスの ID（bee status list -p <PROJECT> で確認）
  STATUS_IN_PROGRESS: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ブランチ名の先頭から課題キーを取り出す（例: DEMO-1/fix-login → DEMO-1）
      - name: Extract issue key from branch name
        id: issue
        run: |
          KEY=$(echo "$BRANCH" | grep -oE '^[A-Z][A-Z0-9_]*-[0-9]+' || true)
          if [ -z "$KEY" ]; then
            echo "No issue key in branch name: $BRANCH"
          else
            echo "Issue key: $KEY"
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}

      - name: Build PR link text
        id: pr-link
        if: steps.issue.outputs.key != ''
        run: |
          echo "md=[${REPO}#${PR_NUMBER}](${PR_URL})" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      # PR 作成 → 課題にリンクをコメントし、ステータスを「処理中」に
      - name: Update status to "In Progress" and comment PR link
        if: github.event.action == 'opened' && steps.issue.outputs.key != ''
        run: |
          npx @nulab/bee@1 issue edit "$KEY" --status "$STATUS_IN_PROGRESS"
          npx @nulab/bee@1 issue comment "$KEY" --body "PR ${PR_LINK} が作成されました"
        env:
          KEY: ${{ steps.issue.outputs.key }}
          PR_LINK: ${{ steps.pr-link.outputs.md }}

      # PR マージ → 課題をクローズ
      - name: Close linked issue
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.issue.outputs.key != ''
        run: |
          npx @nulab/bee@1 issue close "$KEY" \
            --comment "PR ${PR_LINK} のマージにより自動クローズ"
        env:
          KEY: ${{ steps.issue.outputs.key }}
          PR_LINK: ${{ steps.pr-link.outputs.md }}
